services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      PERSISTENCE_MODE: mock
      BIGQUERY_EXPORT_MODE: mock
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:3001/ws
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:3001
      NEXT_PUBLIC_WS_BASE_URL: ws://backend:3001/ws
    ports:
      - "3000:8080"
    depends_on:
      - backend
